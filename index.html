<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --borda:#2a2f3a; --txt:#e8eaf0; --sub:#9aa3b2; --cor:#6c8cff; --ok:#4cc38a; --erro:#ff6b6b; --alerta:#f5b84a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--sub); margin: 28px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; }
  textarea { width:100%; min-height:120px; resize:vertical; background:transparent; color:var(--txt); border:0; outline:0; font:inherit; }
  .linha { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  select, button, .arquivo { background:#20242e; color:var(--txt); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
  button.principal { background:var(--cor); border-color:var(--cor); color:#fff; font-weight:600; margin-left:auto; }
  button:disabled { opacity:.5; cursor:default; }
  button.gravando { background:var(--erro); border-color:var(--erro); color:#fff; }
  input[type=file] { display:none; }
  .anexos { color:var(--sub); font-size:13px; margin-top:8px; }
  .aviso { color:var(--erro); font-size:13px; margin-top:8px; min-height: 1em; }
  .pedido { margin-bottom:10px; cursor:pointer; }
  .pedido .topo { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--sub); }
  .pedido .texto { margin-top:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .pedido:not(.aberto) .texto { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .selo { padding:2px 8px; border-radius:99px; font-size:12px; font-weight:600; background:#20242e; color:var(--sub); }
  .selo.concluido { color:var(--ok); } .selo.erro, .selo.sem_projeto, .selo.interrompido { color:var(--erro); }
  .selo.executando, .selo.roteando, .selo.recebido { color:var(--alerta); }
  .detalhe { margin-top:10px; border-top:1px solid var(--borda); padding-top:10px; cursor:auto; }
  pre { background:#0b0d11; border:1px solid var(--borda); border-radius:8px; padding:10px; max-height:360px; overflow:auto; white-space:pre-wrap; overflow-wrap:anywhere; font:12.5px/1.45 ui-monospace, Consolas, monospace; margin:8px 0 0; }
  .rotulo { font-size:12px; color:var(--sub); text-transform:uppercase; letter-spacing:.05em; margin-top:10px; }
  .vazio { color:var(--sub); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<form id="login" hidden onsubmit="entrar(event)" style="position:fixed; inset:0; z-index:9; background:var(--bg); display:grid; place-items:center;">
  <div class="card" style="width:min(340px, 90vw)">
    <h1>Brain</h1>
    <input id="senha" type="password" placeholder="Senha" autocomplete="current-password" style="width:100%; background:#20242e; color:var(--txt); border:1px solid var(--borda); border-radius:8px; padding:10px 12px; font:inherit;">
    <div class="linha"><button class="principal" type="submit">Entrar</button></div>
    <div class="aviso" id="avisoLogin"></div>
  </div>
</form>
<main>
  <h1>Brain</h1>

  <div class="card">
    <textarea id="texto" placeholder="Diga ou escreva o que precisa. Ex.: entre no Vizantu Tarefas e crie uma página de financeiro com…"></textarea>
    <div class="anexos" id="anexos"></div>
    <div class="linha">
      <button id="mic" title="Ditar">🎤 Ditar</button>
      <label class="arquivo">📎 Anexar<input type="file" id="arquivo" multiple></label>
      <select id="projeto" title="Projeto"></select>
      <select id="agente" title="Agente">
        <option value="">Agente padrão</option>
        <option value="claude">Claude</option>
        <option value="codex">Codex</option>
      </select>
      <button class="principal" id="enviar">Enviar</button>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>

  <h2>Pedidos</h2>
  <div id="lista"><div class="vazio">Nenhum pedido ainda.</div></div>

  <h2>Conexões</h2>
  <div class="card" id="conexoes"><div class="vazio">Verificando…</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const ROTULOS = { recebido:'recebido', roteando:'descobrindo o projeto', executando:'executando', concluido:'concluído', erro:'erro', sem_projeto:'projeto não identificado', cancelado:'cancelado', interrompido:'interrompido' };
let arquivos = [];
let aberto = null;
let projetos = [];

const api = (caminho, corpo) =>
  fetch(caminho, corpo === undefined ? {} : { method:'POST', headers:{ 'content-type':'application/json', 'x-brain':'1' }, body: JSON.stringify(corpo) })
    .then(async (r) => {
      const j = await r.json();
      if (r.status === 401 && caminho !== '/api/login') $('login').hidden = false;
      if (!r.ok) throw new Error(j.erro || r.statusText);
      return j;
    });

async function entrar(e) {
  e.preventDefault();
  $('avisoLogin').textContent = '';
  try {
    await api('/api/login', { senha: $('senha').value });
    $('login').hidden = true; $('senha').value = '';
    carregarConfig();
    carregarProjetos().then(atualizar).then(atualizarConexoes);
  } catch (x) { $('avisoLogin').textContent = x.message; }
}

const escapar = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

async function carregarProjetos() {
  projetos = await api('/api/projetos');
  $('projeto').innerHTML = '<option value="auto">Projeto: automático</option>' +
    projetos.map((p) => `<option value="${escapar(p.id)}" ${p.ativo ? '' : 'disabled'}>${escapar(p.nome)}${p.ativo ? '' : ' (indisponível)'}</option>`).join('');
}

// ----- anexos -----
$('arquivo').onchange = (e) => { arquivos = arquivos.concat([...e.target.files]); e.target.value = ''; mostrarAnexos(); };
function mostrarAnexos() {
  $('anexos').innerHTML = arquivos.map((f, i) => `📄 ${escapar(f.name)} <a href="#" data-i="${i}">remover</a>`).join(' · ');
}
$('anexos').onclick = (e) => { if (e.target.dataset.i) { e.preventDefault(); arquivos.splice(+e.target.dataset.i, 1); mostrarAnexos(); } };
const emBase64 = (f) => new Promise((ok, falha) => { const l = new FileReader(); l.onload = () => ok(l.result.split(',')[1]); l.onerror = falha; l.readAsDataURL(f); });

// ----- ditado -----
// Com OPENAI_API_KEY no servidor: grava o áudio e transcreve lá, atualizando o
// texto enquanto você fala (funciona igual em PC, Android e iPhone). Sem a
// chave: usa o reconhecimento de voz do navegador, quando existir.
const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
let transcricaoNoServidor = false;
let rec = null;        // reconhecimento do navegador em andamento
let gravador = null;   // gravação em andamento
let pararGravacao = null;

const botaoMic = (gravando, texto) => { $('mic').classList.toggle('gravando', gravando); $('mic').textContent = texto; };

const carregarConfig = () => api('/api/config').then((c) => {
  transcricaoNoServidor = c.transcricao && !!navigator.mediaDevices?.getUserMedia && !!window.MediaRecorder;
  if (!transcricaoNoServidor && !Reconhecimento) { $('mic').disabled = true; $('mic').title = 'Ditado indisponível neste navegador'; }
}).catch(() => {});
carregarConfig();

async function gravar() {
  const fluxo = await navigator.mediaDevices.getUserMedia({ audio: true });
  const tipo = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find((t) => MediaRecorder.isTypeSupported(t)) || '';
  const base = $('texto').value ? $('texto').value.trimEnd() + ' ' : '';
  const pedacos = [];
  let seq = 0, aplicado = 0, emCurso = false;

  // Transcreve tudo que foi gravado até agora; a resposta mais nova sempre vence.
  const transcrever = async (final) => {
    if (!pedacos.length || (emCurso && !final)) return;
    const meu = ++seq;
    emCurso = true;
    try {
      const audio = new Blob(pedacos, { type: gravador.mimeType || tipo });
      const { texto } = await api('/api/transcrever', { audio: await emBase64(audio), tipo: audio.type });
      if (meu > aplicado) { aplicado = meu; $('texto').value = base + texto; }
    } catch (e) { if (final) $('aviso').textContent = e.message; }
    emCurso = false;
  };

  gravador = new MediaRecorder(fluxo, tipo ? { mimeType: tipo, audioBitsPerSecond: 32000 } : {});
  gravador.ondataavailable = (e) => { if (e.data.size) pedacos.push(e.data); };
  gravador.start(1000);
  const parcial = setInterval(() => transcrever(false), 3000);
  botaoMic(true, '⏹ Parar');

  pararGravacao = () => new Promise((pronto) => {
    clearInterval(parcial);
    gravador.onstop = async () => {
      fluxo.getTracks().forEach((t) => t.stop());
      botaoMic(false, '… transcrevendo');
      await transcrever(true);
      gravador = null; pararGravacao = null;
      botaoMic(false, '🎤 Ditar');
      pronto();
    };
    gravador.stop();
  });
}

function ditarNoNavegador() {
  const base = $('texto').value ? $('texto').value.trimEnd() + ' ' : '';
  rec = new Reconhecimento();
  rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (e) => { $('texto').value = base + [...e.results].map((r) => r[0].transcript).join(''); };
  rec.onerror = (e) => { $('aviso').textContent = 'Ditado: ' + e.error; };
  rec.onend = () => { rec = null; botaoMic(false, '🎤 Ditar'); };
  rec.start();
  botaoMic(true, '⏹ Parar');
}

// Para o ditado em andamento e só devolve quando o texto final estiver no campo.
async function encerrarDitado() {
  if (rec) rec.stop();
  if (pararGravacao) await pararGravacao();
}

$('mic').onclick = async () => {
  $('aviso').textContent = '';
  if (rec || gravador) return encerrarDitado();
  if (!transcricaoNoServidor) return ditarNoNavegador();
  try { await gravar(); } catch (e) { $('aviso').textContent = 'Microfone: ' + e.message; }
};

// ----- enviar -----
$('enviar').onclick = async () => {
  $('aviso').textContent = '';
  $('enviar').disabled = true;
  await encerrarDitado();
  try {
    const anexos = await Promise.all(arquivos.map(async (f) => ({ nome: f.name, base64: await emBase64(f) })));
    const pedido = await api('/api/pedidos', { texto: $('texto').value, agente: $('agente').value, projeto: $('projeto').value, anexos });
    $('texto').value = ''; arquivos = []; mostrarAnexos(); aberto = pedido.id;
    atualizar();
  } catch (e) { $('aviso').textContent = e.message; }
  $('enviar').disabled = false;
};

// ----- lista -----
async function atualizar() {
  let pedidos;
  try { pedidos = await api('/api/pedidos'); } catch { return; }
  if (!pedidos.length) return;
  const detalhe = aberto ? await api('/api/pedidos/' + aberto).catch(() => null) : null;
  const rolagem = document.querySelector('pre.log')?.scrollTop;
  const noFim = (() => { const p = document.querySelector('pre.log'); return !p || p.scrollTop + p.clientHeight >= p.scrollHeight - 30; })();
  $('lista').innerHTML = pedidos.map((p) => {
    const nome = projetos.find((x) => x.id === p.projeto)?.nome || (p.projeto ?? '—');
    const hora = new Date(p.criadoEm).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
    let extra = '';
    if (detalhe && detalhe.id === p.id) {
      extra = `<div class="detalhe">
        ${p.erro ? `<div class="aviso">${escapar(p.erro)}</div>` : ''}
        ${p.textoOriginal ? `<div class="rotulo">Como foi ditado</div><div>${escapar(p.textoOriginal)}</div>` : ''}
        ${p.roteador ? `<div class="rotulo">Roteador</div><div>${escapar(p.roteador.motivo)}</div>` : ''}
        ${p.resultado ? `<div class="rotulo">Resultado</div><pre>${escapar(p.resultado)}</pre>` : ''}
        <div class="rotulo">Log</div><pre class="log">${escapar(detalhe.log) || 'sem saída ainda'}</pre>
        ${p.status === 'executando' ? `<div class="linha"><button data-cancelar="${p.id}">Cancelar</button></div>` : ''}
      </div>`;
    }
    return `<div class="card pedido ${aberto === p.id ? 'aberto' : ''}" data-id="${p.id}">
      <div class="topo"><span class="selo ${p.status}">${ROTULOS[p.status] || p.status}</span><span>${escapar(nome)}</span><span>· ${escapar(p.agente || 'agente padrão')}</span><span style="margin-left:auto">${hora}</span></div>
      <div class="texto">${escapar(p.texto)}</div>${extra}</div>`;
  }).join('');
  const log = document.querySelector('pre.log');
  if (log) log.scrollTop = noFim ? log.scrollHeight : rolagem;
}
$('lista').onclick = async (e) => {
  if (e.target.dataset.cancelar) { await api(`/api/pedidos/${e.target.dataset.cancelar}/cancelar`, {}).catch((x) => ($('aviso').textContent = x.message)); return atualizar(); }
  if (e.target.closest('.detalhe')) return;
  const card = e.target.closest('.pedido');
  if (card) { aberto = aberto === card.dataset.id ? null : card.dataset.id; atualizar(); }
};

// ----- conexões (login do Claude, do Codex e do GitHub nesta máquina) -----
let loginPendente = false;
async function atualizarConexoes() {
  let lista;
  try { lista = await api('/api/conexoes'); } catch { return; }
  loginPendente = lista.some((c) => c.login?.estado === 'aguardando');
  if (document.activeElement?.dataset.codigoDe) return; // não redesenha enquanto você digita o código
  $('conexoes').innerHTML = lista.map((c) => {
    const l = c.login;
    let passo = '';
    if (l?.estado === 'aguardando') {
      passo = `<div class="detalhe">
        ${l.url ? `<div>1. <a href="${escapar(l.url)}" target="_blank" rel="noopener">Abrir a página de autorização</a></div>` : '<div>Iniciando o login…</div>'}
        ${l.codigo ? `<div>2. Digite lá este código: <b>${escapar(l.codigo)}</b></div>` : ''}
        ${l.pedeCodigo ? `<div class="linha">2. Cole aqui o código que a página mostrar:
          <input data-codigo-de="${c.id}" style="flex:1; min-width:160px; background:#20242e; color:var(--txt); border:1px solid var(--borda); border-radius:8px; padding:8px 12px; font:inherit;">
          <button data-enviar-codigo="${c.id}">Enviar</button></div>` : ''}
        <div class="anexos">Esta tela atualiza sozinha quando a conexão for concluída.</div>
      </div>`;
    } else if (l?.estado === 'erro') {
      passo = `<div class="aviso">${escapar(l.erro)}</div>`;
    }
    return `<div style="padding:6px 0">
      <div class="linha" style="margin-top:0">
        <b>${escapar(c.nome)}</b>
        <span class="selo ${c.conectado ? 'concluido' : 'erro'}">${c.conectado ? 'conectado' : 'não conectado'}</span>
        <button data-entrar="${c.id}" style="margin-left:auto">${c.conectado ? 'Reconectar' : 'Conectar'}</button>
      </div>${passo}</div>`;
  }).join('');
}
$('conexoes').onclick = async (e) => {
  const { entrar, enviarCodigo } = e.target.dataset;
  try {
    if (entrar) { e.target.disabled = true; e.target.textContent = 'Iniciando…'; await api(`/api/conexoes/${entrar}/entrar`, {}); }
    if (enviarCodigo) {
      const campo = document.querySelector(`[data-codigo-de="${enviarCodigo}"]`);
      await api(`/api/conexoes/${enviarCodigo}/codigo`, { codigo: campo.value });
      campo.blur();
    }
  } catch (x) { $('aviso').textContent = x.message; }
  if (entrar || enviarCodigo) atualizarConexoes();
};

carregarProjetos().then(atualizar).then(atualizarConexoes);
setInterval(atualizar, 3000);
setInterval(() => { if (loginPendente) atualizarConexoes(); }, 3000);
</script>
</body>
</html>
